<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — MakGeography</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="brand">
      <span class="brand-mark">MG</span>
      <div>
        <h1>MakGeography</h1>
        <p>HKDSE Geography study site</p>
      </div>
    </div>
    <form method="post" action="/login" autocomplete="off">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autofocus required
             placeholder="Enter the site password" autocomplete="current-password">
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <button type="submit">Sign in</button>
    </form>
    <p class="hint">For MakGeography students only. Ask your teacher if you need the password.</p>
  </div>
</body>
</html>
