name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import check
        run: python -c "import app.main; print('app imports cleanly')"

      - name: Knowledge base integrity
        run: |
          python - <<'PY'
          import json, pathlib, sys
          kb = json.loads(pathlib.Path("data/kb.json").read_text())
          docs = kb.get("docs", [])
          assert docs, "kb.json has no documents"
          chunks = sum(len(d.get("chunks", [])) for d in docs)
          assert chunks > 500, f"only {chunks} chunks — the KB looks truncated"
          print(f"KB OK: {len(docs)} docs, {chunks} chunks")
          PY

      - name: No assessment material in the knowledge base
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          kb = json.loads(pathlib.Path("data/kb.json").read_text())
          bad = re.compile(
              r"(?i)(past paper|predicted grade|first term test|combo quiz|"
              r"mark scheme|answer key|data question set|dbq angles|mc quiz)")
          leaks = [d["path"] for d in kb["docs"] if bad.search(d["path"])]
          if leaks:
              print("Assessment material leaked into the KB:")
              for p in leaks:
                  print("  -", p)
              sys.exit(1)
          print("No assessment material in the KB")
          PY

      - name: Retrieval smoke test
        run: python scripts/test_retrieval.py

      - name: The essay generator writes a two-part question
        run: python scripts/test_essay_parts.py

      - name: The Part (b) stem names a measure, not a case study
        run: python scripts/test_named_measure.py

      - name: A question pattern matches the command pairing it is shown for
        # A pattern describes how its own two parts relate, so a pattern
        # with a different pairing describes a different question. And an
        # 8-mark essay is single-part, so no pattern applies to it.
        run: python scripts/test_essay_patterns.py

      - name: The generator offers only the 12-mark two-part essay
        # The 8-mark essay is single-part with no Part (b); the 16- and
        # 20-mark essays are not the exam's short-essay format.
        run: python scripts/test_essay_marks.py

      - name: No MC question points at a missing figure
        run: python scripts/test_no_dangling_figures.py

      - name: The official HKEAA question bank is intact
        run: python scripts/test_official_bank.py

      - name: Students sign in with their own SID
        run: python scripts/test_roster.py

      - name: The front end reads a JSON reply without a raw Safari error
        # Safari throws "The string did not match the expected pattern."
        # when response.json() is handed a non-JSON body, which is what
        # the Ask panel showed when the tunnel returned an error page.
        # The helper is JavaScript, so it is checked in JavaScriptCore.
        run: python scripts/test_frontend_json.py

      - name: The static build points at a live address
        # The Pages copy cannot answer a question; it links to the live
        # site instead. That link used to be a hostname in the source, and
        # it went dead when the tunnel changed its hostname.
        #
        # The build needs the live server's read-only JSON, so it runs
        # against a local server started here. The tunnel address is not
        # available on the runner, so the check that the address answers
        # is skipped there and the source checks still run.
        run: |
          python -m uvicorn app.main:app --port 8781 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8781/ >/dev/null && break
            sleep 1
          done
          python scripts/build_static_site.py
          python scripts/test_static_live_url.py
          kill %1 || true

      - name: The address a student is given serves the site
        # Serveo shows a warning page to browsers on an HTTP tunnel. The
        # address carries ?serveo-skip-browser-warning so the first
        # visit sets the cookie and lands on the real site.
        #
        # The checks that need a live tunnel are skipped where there is
        # none; the script and URL-file checks still run.
        run: python scripts/test_tunnel_address.py

      - name: The roster and the activity log are not in the repository
        run: |
          # They hold the students' names and what they asked.
          for f in data/roster.json data/activity_log.jsonl; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "$f is tracked by git. It holds the students' names."
              exit 1
            fi
            git check-ignore -q "$f" || {
              echo "$f is not ignored by git."
              exit 1
            }
          done
          echo "The roster and the activity log are not committed"

      - name: The app starts with no vault and no Hermes files
        env:
          HOME: /tmp
        run: |
          # A deployed container has neither the Obsidian vault nor
          # ~/.hermes/.env. The app has to import and serve anyway.
          rm -f /tmp/.env
          python scripts/test_container_startup.py

      - name: No hardcoded password in the source
        run: |
          # Match a real ASSIGNMENT (PASSWORD = "..."), not help text or an
          # os.environ lookup.
          if grep -rnE '(^|[^A-Za-z_.])PASSWORD[[:space:]]*=[[:space:]]*["\x27][^"\x27]{4,}' app/ scripts/ \
             | grep -vE 'os\.environ|PASSWORD_CACHE|_password_cache'; then
            echo "A password appears to be hardcoded in the source."
            exit 1
          fi
          echo "No hardcoded password"

      - name: The app starts without a password configured (lazy resolution)
        env:
          MAKGEO_PASSWORD: ""
        run: python -c "import app.main; print('imports without a password, as intended')"
