name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import check
        run: python -c "import app.main; print('app imports cleanly')"

      - name: Knowledge base integrity
        run: |
          python - <<'PY'
          import json, pathlib, sys
          kb = json.loads(pathlib.Path("data/kb.json").read_text())
          docs = kb.get("docs", [])
          assert docs, "kb.json has no documents"
          chunks = sum(len(d.get("chunks", [])) for d in docs)
          assert chunks > 500, f"only {chunks} chunks — the KB looks truncated"
          print(f"KB OK: {len(docs)} docs, {chunks} chunks")
          PY

      - name: No assessment material in the knowledge base
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          kb = json.loads(pathlib.Path("data/kb.json").read_text())
          bad = re.compile(
              r"(?i)(past paper|predicted grade|first term test|combo quiz|"
              r"mark scheme|answer key|data question set|dbq angles|mc quiz)")
          leaks = [d["path"] for d in kb["docs"] if bad.search(d["path"])]
          if leaks:
              print("Assessment material leaked into the KB:")
              for p in leaks:
                  print("  -", p)
              sys.exit(1)
          print("No assessment material in the KB")
          PY

      - name: Retrieval smoke test
        run: python scripts/test_retrieval.py

      - name: The essay generator writes a two-part question
        run: python scripts/test_essay_parts.py

      - name: The Part (b) stem names a measure, not a case study
        run: python scripts/test_named_measure.py

      - name: No MC question points at a missing figure
        run: python scripts/test_no_dangling_figures.py

      - name: The official HKEAA question bank is intact
        run: python scripts/test_official_bank.py

      - name: Students sign in with their own SID
        run: python scripts/test_roster.py

      - name: The roster and the activity log are not in the repository
        run: |
          # They hold the students' names and what they asked.
          for f in data/roster.json data/activity_log.jsonl; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "$f is tracked by git. It holds the students' names."
              exit 1
            fi
            git check-ignore -q "$f" || {
              echo "$f is not ignored by git."
              exit 1
            }
          done
          echo "The roster and the activity log are not committed"

      - name: The app starts with no vault and no Hermes files
        env:
          HOME: /tmp
        run: |
          # A deployed container has neither the Obsidian vault nor
          # ~/.hermes/.env. The app has to import and serve anyway.
          #
          # This does not use Starlette's test client: that needs httpx2,
          # which is a test-only dependency and has no place in the
          # runtime image. The route is checked by calling it directly.
          rm -f /tmp/.env
          python - <<'PY'
          import os
          for k in ("MINIMAX_API_KEY", "MINIMAX_BASE_URL", "MAKGEO_PASSWORD",
                    "MAKGEO_TEACHER_KEY", "MAKGEO_ROSTER_PATH",
                    "MAKGEO_ROSTER_JSON"):
              os.environ.pop(k, None)
          import app.main as am

          # The health check touches nothing and needs no session.
          assert am.healthz() == {"ok": True}

          # The home page serves: with no roster and no password the site
          # is open, so it must not ask for a sign-in.
          from starlette.requests import Request
          scope = {
              "type": "http", "method": "GET", "path": "/",
              "headers": [], "query_string": b"", "client": ("test", 1),
              "server": ("test", 80), "scheme": "http", "root_path": "",
              "http_version": "1.1",
          }
          resp = am.home(Request(scope))
          assert resp.status_code == 200, resp.status_code
          body = resp.body.decode()
          assert "MakGeography" in body, "the home page did not render"

          # With a roster the home page is the sign-in page, and it must
          # ask for a Student ID. Without one the site is open and the
          # study panels render. Either is correct; what matters is that
          # the page serves.
          if am.roster_mod.allowed_sids():
              assert 'name="identifier"' in body, \\
                  "the sign-in page is not asking for a Student ID"
              print("The roster is present, so the site asks for a Student ID")
          else:
              assert "MC Drilling" in body, \\
                  "the home page is missing its panels"
              print("No roster, so the site opens straight into the tools")

          # The knowledge base still loads from the committed data.
          assert am.get_kb() is not None
          print("The app serves with no vault and no ~/.hermes/.env")
          PY

      - name: No hardcoded password in the source
        run: |
          # Match a real ASSIGNMENT (PASSWORD = "..."), not help text or an
          # os.environ lookup.
          if grep -rnE '(^|[^A-Za-z_.])PASSWORD[[:space:]]*=[[:space:]]*["\x27][^"\x27]{4,}' app/ scripts/ \
             | grep -vE 'os\.environ|PASSWORD_CACHE|_password_cache'; then
            echo "A password appears to be hardcoded in the source."
            exit 1
          fi
          echo "No hardcoded password"

      - name: The app starts without a password configured (lazy resolution)
        env:
          MAKGEO_PASSWORD: ""
        run: python -c "import app.main; print('imports without a password, as intended')"
